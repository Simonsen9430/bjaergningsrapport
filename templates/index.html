<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bjærgningsrapport Live</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="manifest" href="/static/manifest.json">
    <script src="/static/app.js" defer></script>
    <style>
        body {
            background-color: #f7f9fc;
            padding: 30px;
        }
        .form-section {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .entry {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">🚨 Bjærgningsrapport – Live Indtastning</h1>

        <form method="post" enctype="multipart/form-data">
            <div class="form-section">
                <h4>1. Opgaveinformation</h4>
                <div class="mb-3">
                    <label class="form-label">📍 Sted:</label>
                    <input type="text" name="location" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">📝 Beskrivelse af opgave:</label>
                    <input type="text" name="subject" class="form-control" required>
                </div>
            </div>

            <div class="form-section">
                <h4>2. Hændelsesforløb</h4>
                <div id="entries">
                    <div class="entry row g-2">
                        <div class="col-md-2">
                            <input type="time" name="entry_time" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <input type="text" name="entry_desc" class="form-control" placeholder="Beskrivelse" required>
                        </div>
                        <div class="col-md-4">
                            <input type="file" name="entry_image" class="form-control" accept="image/*" capture="environment">
                        </div>
                    </div>
                </div>
                <button type="button" id="addEntry" class="btn btn-secondary mt-2">➕ Tilføj hændelse</button>
            </div>

            <div class="form-section text-end">
                <button type="submit" class="btn btn-primary btn-lg">💾 Gem rapport</button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('addEntry').addEventListener('click', function() {
            const container = document.getElementById('entries');
            const div = document.createElement('div');
            div.className = 'entry row g-2';
            div.innerHTML = `
                <div class="col-md-2">
                    <input type="time" name="entry_time" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <input type="text" name="entry_desc" class="form-control" placeholder="Beskrivelse" required>
                </div>
                <div class="col-md-4">
                    <input type="file" name="entry_image" class="form-control" accept="image/*" capture="environment">
                </div>`;
            container.appendChild(div);
        });
    </script>
</body>
</html>
