<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Rapport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
    <div class="container">
        <h1 class="mb-3">📝 Rapport</h1>

        <!-- Tilbage og PDF-knapper -->
        <div class="d-flex justify-content-between mb-3">
            <a href="/rapporter" class="btn btn-secondary">⬅️ Tilbage til oversigt</a>
            <a href="/rapport/{{ report_id }}/pdf" class="btn btn-danger">📄 Download som PDF</a>
        </div>

        <!-- E-mailformular -->
        <form method="post" action="/rapport/{{ report_id }}/send">
            <div class="input-group mb-4">
                <input type="email" name="email" class="form-control" placeholder="Modtagerens e-mail" required>
                <button type="submit" class="btn btn-success">📧 Send som PDF</button>
            </div>
        </form>

        <!-- Rapportdata -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">{{ report[2] }}</h5>
                <p class="card-text">
                    <strong>Sted:</strong> {{ report[1] }}<br>
                    <strong>Oprettet:</strong> {{ report[0][:16].replace("T", " ") }}
                </p>
            </div>
        </div>

        <!-- Hændelser -->
        <h4>📌 Hændelsesforløb</h4>
        {% for time, description, image in entries %}
        <div class="card mb-2">
            <div class="card-body">
                <strong>{{ time }}</strong> – {{ description }}
                {% if image %}
                    <br><img src="{{ url_for('static', filename='uploads/' + image) }}" class="img-fluid mt-2" style="max-width:300px;">
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
