<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Rapporter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
    <div class="container">
        <h1 class="mb-4">📋 Oversigt over rapporter</h1>
        <a href="/" class="btn btn-primary mb-3">➕ Opret ny rapport</a>

        {% if reports %}
            <ul class="list-group">
            {% for id, timestamp, location, subject in reports %}
                <li class="list-group-item">
                    <strong>{{ timestamp[:16].replace("T", " ") }}</strong> – {{ location }}: {{ subject }}
                    <a href="/rapport/{{ id }}" class="btn btn-sm btn-outline-primary float-end">Vis</a>
                </li>
            {% endfor %}
            </ul>
        {% else %}
            <p>Ingen rapporter endnu.</p>
        {% endif %}
    </div>
</body>
</html>
