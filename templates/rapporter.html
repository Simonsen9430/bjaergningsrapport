<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Rapporter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-3">
    <div class="container">
        <h1 class="mb-4">📋 Oversigt over rapporter</h1>
        <a href="/" class="btn btn-primary mb-3">➕ Opret ny rapport</a>

        {% if reports %}
            <div class="list-group">
                {% for id, timestamp, location, subject in reports %}
                <div class="list-group-item d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-2">
                    <div>
                        <strong>{{ timestamp[:16].replace("T", " ") }}</strong><br>
                        {{ location }} – {{ subject }}
                    </div>
                    <a href="/rapport/{{ id }}" class="btn btn-outline-primary mt-2 mt-md-0">Vis</a>
                </div>
                {% endfor %}
            </div>
        {% else %}
            <p class="text-muted">Ingen rapporter endnu.</p>
        {% endif %}
    </div>
</body>
</html>
