<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Login - Bjærgningsrapport</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .logo { max-width: 200px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container d-flex flex-column justify-content-center align-items-center vh-100">
        <img src="{{ url_for('static', filename='sos-logo.png') }}" alt="SOS Dansk Autohjælp" class="logo">
        <div class="card p-4 shadow-sm" style="min-width: 300px;">
            <h4 class="mb-3 text-center">Login</h4>
            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <form method="post" action="/login">
                <div class="mb-3">
                    <input type="text" name="username" class="form-control" placeholder="Brugernavn" required>
                </div>
                <div class="mb-3">
                    <input type="password" name="password" class="form-control" placeholder="Adgangskode" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Log ind</button>
            </form>
        </div>
    </div>
</body>
</html>
